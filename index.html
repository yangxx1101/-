<h1>浮生一夢・古代人生模擬器</h1>
<p>免費線上古代人生模擬遊戲。從出生開始，你可以發展文才、武藝、財富、聲望與品德，選擇工作與仕途，經歷婚姻、孩子、房產、家族與隨機事件。</p>
<p>遊戲特色包括屬性天賦、性格、好感度、家族系統、房產升級、婚姻選擇、孩子培養、隨機任務、成就、隱藏結局，以及死亡後的家族繼承與多世代人生。</p>
<p>支援手機與電腦瀏覽器，開啟網頁即可遊玩。</p>
</section>

function applyChoiceConsequence(e,lab,fx){
  S.choiceCount=(S.choiceCount||0)+1;

  if((fx.vir||0)>0){c.仁+=fx.vir;S.worldFlags.goodDeeds=(S.worldFlags.goodDeeds||0)+1;if(S.family?.rep!=null)S.family.rep=Math.min(20,S.family.rep+1);}
  if((fx.fame||0)>0){c.權+=fx.fame;S.worldFlags.reputation=(S.worldFlags.reputation||0)+1;if(S.family?.rep!=null)S.family.rep=Math.min(20,S.family.rep+1);}
  if((fx.gold||0)>0){c.財+=fx.gold;S.worldFlags.wealth=(S.worldFlags.wealth||0)+1;}
  if((fx.mar||0)>0){c.武+=fx.mar;S.worldFlags.martial=(S.worldFlags.martial||0)+1;}
  if(S.king){
    if((fx.vir||0)>0)S.pp=Math.min(12,(S.pp||0)+1);
    if((fx.fame||0)>0)S.ns=Math.min(12,(S.ns||0)+1);
    if((fx.gold||0)<0)S.pp=Math.max(0,(S.pp||0)-1);
    if((fx.mar||0)>0)S.ns=Math.min(12,(S.ns||0)+1);
  }
  // 重大選擇留下「因果」，數年後可能轉化為人物、家族或朝廷事件。
  if(Math.max(Math.abs(fx.vir||0),Math.abs(fx.fame||0),Math.abs(fx.gold||0),Math.abs(fx.mar||0),Math.abs(fx.int||0))>=2){
    S.pending=S.pending||[];S.pending.push({age:S.age+2+R(5),type:(fx.vir||0)>0?"仁":(fx.gold||0)>0?"財":(fx.mar||0)>0?"武":"權",title:e.t,choice:lab});
    if(S.pending.length>8)S.pending.shift();
  }
  S.causal=c;
}

function v6Init(){

 if(!S.family.ext)S.family.ext={status:'平民',influence:3,land:Math.max(1,S.territory.land),treasury:Math.max(100,S.v6.money),honor:0,branches:1,memberStatus:{}};

}

}

 if(S.royal)st='宗室';S.family.ext.status=st;S.family.ext.influence=Math.max(1,Math.min(20,3+score+Math.floor((S.family.rep||0)/2)));S.family.ext.land=Math.max(S.family.ext.land||0,S.territory?.land||0);S.family.ext.treasury=Math.max(0,Math.round((S.v6?.money||0)+(S.estate?.lv||0)*180));S.family.ext.honor=Math.max(0,(S.legacy?.renown||0)+(S.s.fame||0));
 if(S.kin)S.kin.forEach(k=>{let ks=st;if(k.c){let vals=Object.values(k.c);if((k.c.int||0)>=6)ks='讀書人';else if((k.c.mar||0)>=6)ks='武人';else if((k.c.vir||0)>=6)ks='善士';else if((k.c.gold||0)>=6)ks='商人'}k.familyStatus=ks});if(S.kc)S.kc.forEach(k=>{let c=k.c||{};k.status=(c.int||0)>=6?'才子':(c.mar||0)>=6?'武生':(c.vir||0)>=6?'善士':(c.chr||0)>=6?'藝人':'家中後輩'});
}

 anbu:{jinwei:1,dongchang:2,jinyi:0}

const TITLES={jinwei:['校尉','千戶','副指揮使','指揮使','都督'],dongchang:['檔頭','掌班','掌刑千戶','提督太監','東廠提督'],jinyi:['校尉','百戶','千戶','鎮撫使','指揮使'],anbu:['密探','司使','副司正','司正','玄衣令']};

 v8Init();
 if(!S.v9)S.v9={relations:{jinwei:0,dongchang:0,jinyi:0,anbu:0},appointed:false,appointedTitle:'',investigations:0,power:0,scandals:0};

 if(score>=need){S.v9.investigations++;S.v9.power++;S.s.fame=Math.min(12,(S.s.fame||0)+1);S.family.rep=Math.min(12,(S.family.rep||0)+1);S.nation.stability=Math.min(10,(S.nation.stability||0)+1);S.cur.push(`🔎 密查成功：你查明「${target}」的罪證，案件震動朝廷。`);S.hist.push(`${S.age}歲 查辦：${target}`);}

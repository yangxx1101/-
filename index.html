function talentText(){return preview.talents.map(x=>`<span class="tag ${x==='天命'?'rare':''}">${x}</span>`).join('')}
function renderStart(){
 $('#app').innerHTML=`<div class="top"><div class="brand"><div class="seal">生</div><div><div class="title">浮生一夢</div><div class="sub">古代人生模擬器 · v12.0 重製版</div></div></div><div class="topstats"><span class="pill">隨機人生</span><span class="pill">架空古代</span></div></div><main class="screen"><div class="hero center"><div class="muted">一紙生辰，萬里人生</div><h1>你將投身何門？</h1><p>每一次投胎，家門、地域、性別、性情與天賦都會重新抽取。<br>你無法選擇起點，只能決定如何走完這一生。</p><div class="card" style="text-align:left;max-width:720px;margin:20px auto"><div class="identity"><div><div class="muted small">姓名</div><b>${preview.name}</b></div><div><div class="muted small">性別</div><b>${preview.gender}</b></div><div><div class="muted small">出生地</div><b>${preview.region}</b></div><div><div class="muted small">家門</div><b>${preview.id.name}</b></div></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><p style="margin:0">${preview.id.desc}</p><div style="margin-top:12px">性格：<span class="tag">${preview.personality}</span> 天賦：${talentText()}</div><div class="row"><span>父親</span><span>${preview.parents[0]}歲 · ${preview.id.name==='官宦之家'?'地方官':'家中長輩'}</span></div><div class="row"><span>母親</span><span>${preview.parents[1]}歲 · ${preview.id.name==='商戶'?'掌家':'主內'}</span></div></div><div class="actions" style="justify-content:center"><button class="btn" data-action="reroll">再投一胎</button><button class="btn primary" data-action="enter">落地此世</button></div><p class="small muted">稀有身分不常出現。你可以一直重新投胎。</p></div></main>`;
}
function startGame(){buildState();renderGame();toast('你降生了。這一生，從今天開始。')}
function statLabel(){return `錢 ${S.stats.gold}貫 · 名望 ${S.stats.rep} · 健康 ${S.stats.hp}`}
function ageStage(){if(S.age<=2)return'嬰幼兒';if(S.age<=5)return'童年';if(S.age<=11)return'啟蒙';if(S.age<=15)return'少年';if(S.age<=25)return'青年';if(S.age<=45)return'壯年';if(S.age<=65)return'中晚年';return'晚年'}
function currentCareer(){if(!S.career.type)return'尚未定業';let arr=careers[S.career.type];return arr[Math.min(S.career.level,arr.length-1)][0]}
function availableEvents(){let pool=eventBank.filter(e=>S.age>=e.min&&S.age<=e.max&&!S.eventHistory.slice(-8).includes(e.title));if(!pool.length)pool=eventBank.filter(e=>S.age>=e.min&&S.age<=e.max&&!S.eventHistory.slice(-3).includes(e.title));return pool}
function nextEvent(){let pool=availableEvents();return pool.length?R(pool):null}
function makeEvent(){let e=nextEvent();if(!e)return;S.lastEvent=e;S.eventHistory.push(e.title);if(S.eventHistory.length>30)S.eventHistory.shift();}
function renderGame(){
 if(!S.alive){renderDeath();return}
 let e=S.lastEvent;
 $('#app').innerHTML=`<div class="top"><div class="brand"><div class="seal">${S.age<16?'童':S.age<35?'生':S.age<55?'業':'暮'}</div><div><div class="title">${S.name}</div><div class="sub">${S.age}歲 · ${ageStage()} · ${S.region} · ${S.identity.name}</div></div></div><div class="topstats"><span class="pill">${statLabel()}</span><span class="pill">${currentCareer()}</span></div></div><main class="screen"><div class="grid"><section><div class="card"><div class="row"><b>${S.age}歲 · ${ageStage()}</b><span class="muted">第 ${S.year} 年</span></div><div class="bar"><i style="width:${Math.min(100,S.age)}%"></i></div><p style="line-height:1.9">${lifeIntro()}</p></div>${e?`<div class="timeline card"><div class="event"><div class="small muted">今日事件</div><h2>${e.title}</h2><p style="line-height:1.9">${e.text}</p><div class="choice">${e.opts.map((o,n)=>`<button class="btn" data-choice="${n}">${o[0]}</button>`).join('')}</div></div></div>`:`<div class="card timeline center"><h2>今年尚未落筆</h2><p class="muted">你可以安排兩項日常行動，讓這一年留下自己的痕跡。</p></div>`}<div class="card timeline"><h3>今年的生活</h3><div class="actions">${actionButtons()}</div><p class="small muted">已用 ${S.actions}/2 項行動</p></div></section><aside><div class="card"><h3>人生狀態</h3><div class="statgrid"><div class="stat">學識<b>${S.stats.int}</b></div><div class="stat">武藝<b>${S.stats.mar}</b></div><div class="stat">德行<b>${S.stats.vir}</b></div><div class="stat">名望<b>${S.stats.rep}</b></div><div class="stat">家財<b>${S.stats.gold}</b></div><div class="stat">心情<b>${S.stats.mood}</b></div></div></div><div class="card"><h3>家門</h3><div class="row"><span>父母</span><span>${S.parents[0]}歲 / ${S.parents[1]}歲</span></div><div class="row"><span>配偶</span><span>${S.spouse||'未婚'}</span></div><div class="row"><span>子女</span><span>${S.children.length}人</span></div><div class="row"><span>職業</span><span>${currentCareer()}</span></div></div><div class="card"><h3>今年記錄</h3>${S.history.slice(-4).map(x=>`<div class="row small"><span>${x}</span></div>`).join('')||'<span class="muted">尚無記錄</span>'}</div></aside></div></main><nav class="bottom"><button data-nav="person">人物</button><button data-nav="family">家族</button><button data-nav="career">職業</button><button data-nav="life">人生簿</button><button data-action="next">下一年</button><button data-action="save">保存</button></nav>`;
}
function lifeIntro(){if(S.age<=5)return'你生活在家人的照料與鄰里聲音裡。米香、柴火、雨聲與節令，構成最早的記憶。';if(S.age<=15)return'你開始認識這個世界：私塾、田地、市集、作坊與同伴，都在慢慢告訴你古代人的生活如何運轉。';if(S.age<=35)return'你開始為自己的家計與名聲奔忙。每一次選擇，都可能改變你的職業、婚姻與家門。';return'歲月已經讓你看過許多人的聚散。如今更重要的，是家業、子女、父母與你留下的名聲。'}
function actionButtons(){let acts=[['study','讀書'],['work','勞作'],['market','去市集'],['family','幫家中'],['friend','訪友'],['martial','習武']];if(S.age<6)acts=[['family','陪伴家人'],['play','出去玩'],['rest','休息']];if(S.age>=12&&S.age<25)acts.push(['learn','拜師學藝']);return acts.map(a=>`<button class="btn" data-do="${a[0]}" ${S.actions>=2?'disabled':''}>${a[1]}</button>`).join('')}
function doAction(type){if(S.actions>=2){toast('今年已安排兩項行動。');return}let m={study:['你讀了一個上午。墨香與紙頁讓你慢慢積累學識。',{int:1,mood:-1}],work:['你跟著家人忙了一天，知道一文錢來得並不容易。',{gold:2,mar:1}],market:['你去了市集，看米價、布價與人情，也聽見不少消息。',{int:1,gold:1}],family:['你留在家裡幫忙，家人對你的依靠又多了一分。',{vir:1,mood:2}],friend:['你去拜訪朋友，交換近況與消息。',{mood:2,friend:1}],martial:['你練了一陣弓馬或拳腳，筋骨更加結實。',{mar:1,hp:1}],play:['你和同伴在巷口玩了一天。',{mood:4,friend:1}],rest:['你安安靜靜休息，身體恢復了些。',{hp:4,mood:2}],learn:['你向師傅學習手藝。',{int:1,career:1,gold:1}]};let [txt,fx]=m[type];applyFx(fx);S.actions++;S.history.push(txt);if(type==='learn'&&S.age>=12&&S.age<=25&&!S.career.type)chooseCareer();renderGame();}
function applyFx(fx){Object.entries(fx).forEach(([k,v])=>{if(k==='friend')S.friends+=v;else if(k==='career'){if(!S.career.type&&S.age>=12){S.career.type=R(S.identity.careers);S.career.level=0;S.career.years=0;S.history.push(`你開始走上${S.career.type}之路。`)}}else if(k==='marry'&&v)marry();else S.stats[k]=(S.stats[k]||0)+v});S.stats.hp=clamp(S.stats.hp,0,100);S.stats.mood=clamp(S.stats.mood,0,100);S.stats.rep=Math.max(0,S.stats.rep);S.stats.gold=Math.max(0,S.stats.gold)}
function chooseCareer(){let type=R(S.identity.careers);S.career={type,level:0,years:0};S.history.push(`你拜入${type}一門，從最基礎的位置做起。`)}
function advanceCareer(){if(!S.career.type&&S.age>=14&&Math.random()<.25)chooseCareer();if(!S.career.type)return;S.career.years++;let need=[3,4,6,8][S.career.level]||99;if(S.career.years>=need&&S.stats.int+S.stats.mar+S.stats.rep+S.stats.vir>=18+S.career.level*4){S.career.level++;S.career.years=0;S.history.push(`你的${S.career.type}身分提升為「${currentCareer()}」，能做的事情更多了。`);}}
function marry(){if(S.spouse||S.age<16)return toast('目前還不適合成婚。');S.spouse=R(['沈氏','顧氏','林氏','周氏','蘇氏','王氏','陳氏']);S.history.push(`你與${S.spouse}成婚，兩家開始共同過日子。`);toast('成婚了。從今以後，家計不再只是你一人的事。')}
function yearEnd(){if(!S.alive)return;S.age++;S.year++;S.actions=0;S.stats.mood+=Math.random()<.5?1:-1;S.stats.hp-=Math.random()<.08?ri(1,6):0;if(S.age>=16&&!S.spouse&&Math.random()<.08)S.spouse=R(['沈氏','顧氏','林氏']);if(S.spouse&&S.age>=18&&Math.random()<.18&&S.children.length<6){let child={name:R(surnames)+R(given),age:0};S.children.push(child);S.history.push(`家中添了一名孩子：${child.name}。`)}advanceCareer();makeEvent();if(S.age>72&&Math.random()<.06)S.stats.hp-=20;if(S.stats.hp<=0||S.age>=95)S.alive=false;renderGame()}
function showModal(title,html){$('#modal').innerHTML=`<div class="modal"><div class="modalbox"><div class="row"><h2 style="margin:0">${title}</h2><button class="btn" data-close>關閉</button></div>${html}</div></div>`}
function nav(type){if(!S)return;if(type==='person')showModal('人物誌',`<div class="row"><span>姓名</span><b>${S.name}</b></div><div class="row"><span>身分</span><b>${S.identity.name}</b></div><div class="row"><span>性格</span><b>${S.personality}</b></div><div class="row"><span>天賦</span><span>${S.talents.map(x=>`<span class="tag">${x}</span>`).join('')}</span></div><div class="row"><span>出生地</span><span>${S.region}</span></div>`);if(type==='family')showModal('家族',`<div class="row"><span>家門</span><b>${S.identity.name}</b></div><div class="row"><span>父母</span><span>${S.parents[0]}歲 / ${S.parents[1]}歲</span></div><div class="row"><span>配偶</span><span>${S.spouse||'未婚'}</span></div><div class="row"><span>子女</span><span>${S.children.length?S.children.map(c=>c.name).join('、'):'尚無子女'}</span></div><p class="muted">古代人的人生往往先是家的一部分，之後才慢慢成為自己的故事。</p>`);if(type==='career')showCareer();if(type==='life')showModal('人生簿',S.history.slice().reverse().map((x,i)=>`<div class="row"><span>${S.year-i}</span><span>${x}</span></div>`).join('')||'<p>尚無記錄</p>')}
function showCareer(){let html=`<p>職業不只是名字；階級越高，你能接觸的人、能承擔的責任與能使用的資源越多。</p>`;if(!S.career.type)html+=`<p>目前尚未定業。少年後可透過行動、事件與家門影響選擇道路。</p>`;else{let arr=careers[S.career.type];html+=arr.map((x,i)=>`<div class="row"><span>${i===S.career.level?'▶ ':''}${x[0]}</span><span>${x[1]}</span></div>`).join('')}showModal('職業與職權',html)}
function save(){localStorage.setItem('fusheng_v12',JSON.stringify(S));toast('已保存此生。')}
function load(){let x=localStorage.getItem('fusheng_v12');if(!x)return toast('目前沒有存檔。');try{S=JSON.parse(x);renderGame();toast('已讀取此生。')}catch(e){toast('存檔無法讀取。')}}
function renderDeath(){ $('#app').innerHTML=`<div class="top"><div class="brand"><div class="seal">終</div><div><div class="title">一生已盡</div><div class="sub">${S.name} · ${S.age}歲</div></div></div></div><main class="screen"><div class="hero center"><h1>${S.name}的一生</h1><p>${S.history.slice(-8).join('。')}</p><div class="lifegrid"><div class="stat">名望<b>${S.stats.rep}</b></div><div class="stat">家財<b>${S.stats.gold}</b></div><div class="stat">子女<b>${S.children.length}</b></div></div><div class="actions" style="justify-content:center;margin-top:20px"><button class="btn primary" data-action="rebirth">再投一胎</button><button class="btn" data-action="load">讀取存檔</button></div></div></main>`}
function toast(t){let el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2400)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){$('#modal').innerHTML='';return}if(b.dataset.action==='reroll'){rollIdentity();return}if(b.dataset.action==='enter'){startGame();return}if(b.dataset.action==='next'){yearEnd();return}if(b.dataset.action==='save'){save();return}if(b.dataset.action==='load'){load();return}if(b.dataset.action==='rebirth'){rollIdentity();return}if(b.dataset.choice!=null){let n=+b.dataset.choice;let o=S.lastEvent.opts[n];applyFx(o[1]);S.history.push(`在「${S.lastEvent.title}」中，你選擇了「${o[0]}」。`);S.lastEvent=null;renderGame();return}if(b.dataset.do){doAction(b.dataset.do);return}if(b.dataset.nav){nav(b.dataset.nav);return}});
rollIdentity();
</script></body></html>

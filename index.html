<style>

 {id:'inherit',min:40,max:80,title:'家產分承',text:'一位長輩留下田地、屋舍或商產。兄弟姊妹之間必須議定如何分配。',choices:[['公平分配','virtue',2,'家族關係比較穩定。'],['爭取更多','gold',4,'你得到更多家產，但親族關係惡化。']]},
 {id:'retirement',min:50,max:80,title:'功成身退',text:'你已走過半生。是繼續掌權，還是把位置交給後輩？',cond:s=>s.jobLevel>=3,choices:[['提攜後輩','fame',3,'後輩記住你的恩德。'],['繼續掌權','gold',2,'你仍牢牢掌握手中的資源。']]},
 {id:'old_reflect',min:60,max:80,title:'回望一生',text:'窗外又是一年。你開始整理族譜、田契、書稿與往來書信。',choices:[['整理家史','fame',3,'你的故事被家族記錄下來。'],['把財產交給後輩','family',3,'你開始準備下一代接手。'] ]}
];

let S=null;
function fresh(){return {started:false,name:'',sex:'男',age:0,year:1,region:REGIONS[0][0],familyType:'farmer',familyName:'李',personality:'謹慎',talents:[],gold:3,health:10,mood:7,virtue:2,fame:0,study:0,trade:0,martial:0,craft:0,education:0,jobLevel:0,career:'none',jobTitle:'無',spouse:null,children:[],parents:{father:'',mother:'',alive:true},familyRep:2,land:1,house:1,season:0,actions:2,history:[],logs:[],flags:{},legacy:0,nation:{stability:70,treasury:60,people:70,power:50},done:new Set(),pending:[]};}
function save(){if(!S)return;localStorage.setItem('fusheng_v11',JSON.stringify({...S,done:[...S.done]}));toast('已保存此生');}
function load(){const x=localStorage.getItem('fusheng_v11');if(!x)return false;S=JSON.parse(x);S.done=new Set(S.done||[]);return true}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1600)}
function start(){S=fresh();renderStartChoice()}
function rollIdentity(){
 const f=FAMILIES[R(0,FAMILIES.length-1)], r=REGIONS[R(0,REGIONS.length-1)];
 const sex=Math.random()<.5?'男':'女';
 const surnames=['趙','李','王','張','陳','沈','周','林','蘇','顧','宋','陸'];
 const male=['安','景','遠','謙','明','修','衡','川','昀','昭','辰','澤'], female=['寧','瑤','清','蘭','婉','月','棠','柔','雲','玉','蘅','妍'];
 const given=(sex==='男'?male:female)[R(0,(sex==='男'?male:female).length-1)];
 S.birthRoll={name:given,sex,familyType:f.id,region:r[0],familyName:surnames[R(0,surnames.length-1)],personality:PERSONAL[R(0,PERSONAL.length-1)],talents:[TALENTS[R(0,TALENTS.length-1)][0],TALENTS[R(0,TALENTS.length-1)][0]]};
 return S.birthRoll;
}
function begin(){
 const b=S.birthRoll||rollIdentity(), f=FAMILIES.find(x=>x.id===b.familyType)||FAMILIES[0];
 S.started=true;S.name=b.name;S.sex=b.sex;S.familyType=b.familyType;S.region=b.region;S.familyName=b.familyName;S.personality=b.personality;S.talents=[...new Set(b.talents)];
 while(S.talents.length<2)S.talents.push(TALENTS[R(0,TALENTS.length-1)][0]);
 S.gold=f.wealth+R(-2,2);S.health=10+R(0,3);S.parents.father=S.familyType==='royal'?'當朝天子':f.n+'家主';S.parents.mother=['王氏','李氏','沈氏','周氏'][R(0,3)];
 S.logs.push(`你投胎於${S.region}的${f.n}。這一世從零歲開始。`);S.history.push('投胎');delete S.birthRoll;render();eventForAge(true);
}
function renderStartChoice(){
$('app').innerHTML=`<div class="start"><div class="startbox"><div class="seal">🪷</div><h1>浮生一夢</h1><div class="quote">人生如夢，從一聲啼哭開始。<br>你不是旁觀者，你要在古代真正過完這一生。</div><button onclick="showBirth()">投胎</button></div></div>`}
function showBirth(){
 const b=rollIdentity(), f=FAMILIES.find(x=>x.id===b.familyType), r=REGIONS.find(x=>x[0]===b.region);
 $('app').innerHTML=`<div class="start"><div class="startbox" style="max-width:820px"><div class="seal">🎴</div><h1 style="font-size:34px">命運已抽定</h1><p class="sub">這一世的身分由命運決定。每次投胎，都可能走上完全不同的人生。</p><div class="rollcard"><div class="rolltitle">${b.familyName}${b.name}・${b.sex}</div><div class="rollgrid"><div><b>出生地</b><span>${b.region}</span><small>${r?.[1]||''}</small></div><div><b>家門</b><span>${f.n}</span><small>${f.desc}</small></div><div><b>性格</b><span>${b.personality}</span><small>影響你面對人生的方式</small></div><div><b>天賦</b><span>${b.talents.join('、')}</span><small>${b.talents.map(x=>TALENTS.find(t=>t[0]===x)?.[1]||'').join('；')}</small></div></div></div><div class="rollactions"><button onclick="showBirth()">🔄 再投一胎</button><button class="primary" onclick="begin()">落地此世</button></div></div></div>`
}
function chooseFamily(id){$('family').value=id;FAMILIES.forEach(f=>$('fam-'+f.id)?.classList.toggle('sel',f.id===id))}
function season(){return SEASONS[S.season%4]}
function yearText(){return `${S.year}年・${season()}・${S.region}`}
function ageStage(){if(S.age<3)return '襁褓';if(S.age<6)return '童年';if(S.age<12)return '啟蒙';if(S.age<16)return '少年';if(S.age<30)return '青年';if(S.age<50)return '壯年';if(S.age<65)return '晚年';return '高年'}
function stat(n,v,max=12){return `<div class="meter"><span>${n}</span><div class="progress"><i style="width:${clamp(v/max*100,0,100)}%"></i></div><em>${v}</em></div>`}
function render(){if(!S||!S.started){renderStartChoice();return}const job=S.jobTitle==='無'?'未定職':S.jobTitle;$('app').innerHTML=`<header class="top"><div class="brand"><div class="seal">${S.sex==='女'?'👩':'👨'}</div><div><h1>${S.familyName}${S.name}</h1><small>${yearText()}・${ageStage()}・${job}</small></div><div class="topstats"><span class="pill">💰 ${S.gold}貫</span><span class="pill">🏠 ${S.house}級宅</span><span class="pill">🌾 ${S.land}頃田</span></div></div><nav class="nav"><button onclick="openPerson()">人物</button><button onclick="openFamily()">家族</button><button onclick="openWork()">職業</button><button onclick="openWorld()">天下</button><button onclick="openMenu()">選單</button></nav></header><main class="main"><section class="hero"><h2 class="life-title">${eventTitle()}</h2><div class="sub">${yearText()} ・ ${stageAdvice()}</div><div class="stats" style="margin-top:15px"><div class="stat"><b>${S.age}</b><span>年歲</span></div><div class="stat"><b>${S.gold}</b><span>家財（貫）</span></div><div class="stat"><b>${S.familyRep}</b><span>家聲</span></div><div class="stat"><b>${S.actions}</b><span>本年餘暇</span></div></div></section><div class="grid"><div><div id="eventArea"></div><section class="card"><h3>今年可以做什麼</h3><div class="actions">${actionsHTML()}</div></section></div><aside><section class="card"><h3>此生狀態</h3><div class="meters">${stat('體魄',S.health,15)}${stat('心情',S.mood,10)}${stat('德行',S.virtue,12)}${stat('學識',S.study,20)}${stat('名望',S.fame,20)}${stat('武藝',S.martial,20)}${stat('商才',S.trade,20)}</div></section><section class="card" style="margin-top:18px"><h3>人生記事</h3><div class="timeline">${S.logs.slice(-8).reverse().map(x=>`<div class="log">${x}</div>`).join('')||'<div class="sub">尚無記事</div>'}</div></section></aside></div></main>`;renderEventArea()}
function stageAdvice(){if(S.age<6)return '這個年紀最重要的是吃飽、平安與家庭。';if(S.age<16)return '你開始接觸文字、手藝與同齡人的世界。';if(S.age<30)return '婚姻、職業與家計逐漸成為人生主軸。';if(S.age<50)return '你的選擇會影響家族與地方，而不只是自己。';return '後半生的重點逐漸轉向家族、名聲與傳承。'}
function eventTitle(){return S.pending?.length?S.pending[S.pending.length-1].title:'平常的一年'}
function actionsHTML(){const a=[['📚','讀書','study','累積學識，適合有先生或藏書的家庭'],['🌾','務農','gold','照料田地，穩定家計'],['🧵','做工','craft','學手藝、進作坊'],['🧺','經商','trade','跑市集、做買賣'],['⚔️','習武','martial','練身手，為軍伍做準備'],['🤝','往來','social','拜訪親友、建立人脈'],['🕯️','休養','health','恢復體力與心情'],['🏛️','赴試/辦差','fame','依目前身分處理仕途事務']];return a.map(x=>`<button class="action" onclick="act('${x[2]}')"><b>${x[0]} ${x[1]}</b><small>${x[3]}</small></button>`).join('')}
function act(type){if(S.actions<=0){toast('今年的餘暇已用盡');return}S.actions--;const boost=FAMILIES.find(f=>f.id===S.familyType)?.boost||{};if(type==='study'){S.study+=1+(boost.study||0);S.education=Math.floor(S.study/2);S.mood-=1;S.logs.push('你花了一段時間讀書、抄書或向先生請教。')}else if(type==='gold'){S.gold+=1+(S.familyType==='farmer'?1:0);S.logs.push('你投入家計與生產，換來一些收入。')}else if(type==='craft'){S.craft+=1+(boost.craft||0);S.gold+=R(0,1);S.logs.push('你在作坊或家中學做手藝。')}else if(type==='trade'){S.trade+=1+(boost.trade||0);S.gold+=R(0,2);S.logs.push('你到市集觀察行情、討價還價。')}else if(type==='martial'){S.martial+=1+(S.familyType==='military'?1:0);S.health-=0;S.logs.push('你練習弓、刀、拳腳或騎術。')}else if(type==='social'){S.mood+=1;S.fame+=1;S.logs.push('你拜訪親友，交換消息，也建立了人情。')}else if(type==='health'){S.health=clamp(S.health+2,0,15);S.mood+=1;S.logs.push('你留在家中休息，照料身體。')}else if(type==='fame'){careerAction()}S.gold=clamp(S.gold,0,999);S.health=clamp(S.health,0,15);S.mood=clamp(S.mood,0,10);render();if(S.actions===0)toast('本年餘暇已用盡');}
function careerAction(){if(S.career==='scholar'&&S.jobLevel<5){S.study+=2;S.fame+=1;S.logs.push('你處理文章、講學或應試，士林聲望漸增。')}else if(S.career==='official'){S.fame+=2;S.nation.stability+=1;S.logs.push('你在官署辦差，真正感受到權力與責任。')}else if(S.career==='military'){S.martial+=2;S.fame+=1;S.nation.power+=1;S.logs.push('你操練部伍、巡防或處理軍務。')}else if(S.career==='merchant'){S.gold+=2;S.trade+=1;S.logs.push('你處理契約、貨單與商隊事務。')}else if(S.career==='royal'){S.nation.people+=1;S.fame+=1;S.logs.push('你參與宗室或朝廷議事。')}else{S.fame+=1;S.logs.push('你處理一件地方事務，留下了名字。')}}
function eventPool(force=false){const recent=new Set(S.history.slice(-12));return EVENTS.filter(e=>S.age>=e.min&&S.age<=e.max&&(!e.season||e.season===season())&&(!e.cond||e.cond(S))&&!recent.has(e.id)).sort(()=>Math.random()-.5)}
function eventForAge(first=false){if(!S.started)return;const pool=eventPool();if(!pool.length)return;const chance=first||Math.random()<.72;if(!chance)return;const e=pool[0];S.currentEvent=e;S.history.push(e.id);renderEventArea();}
function eventText(e){return `<div class="event"><span class="tag">${ageStage()}</span><span class="tag">${season()}</span><h2>${e.title}</h2><p>${e.text}</p><div class="choices">${e.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${c[0]}</b><small>${choiceHint(c[1])}</small></button>`).join('')}</div></div>`}
function choiceHint(k){return ({study:'學識提升',gold:'家財變動',virtue:'德行與家聲',mood:'心情與人際',health:'體魄',trade:'商業能力',craft:'手藝',martial:'武藝與軍旅',fame:'名望與身分',social:'人情往來',family:'家族關係'})[k]||'影響人生'}
function renderEventArea(){const area=$('eventArea');if(!area)return;area.innerHTML=S.currentEvent?eventText(S.currentEvent):`<div class="event"><h2>平常的一年</h2><p>${stageAdvice()} 你可以先安排今年的生活，待時機成熟再面對下一件大事。</p></div>`}
function choose(i){const e=S.currentEvent;if(!e)return;const c=e.choices[i];const k=c[1];if(k==='study')S.study+=c[2];if(k==='gold')S.gold+=c[2];if(k==='virtue'){S.virtue+=c[2];S.familyRep+=1}if(k==='mood')S.mood+=c[2];if(k==='health')S.health+=c[2];if(k==='trade')S.trade+=c[2];if(k==='craft')S.craft+=c[2];if(k==='martial')S.martial+=c[2];if(k==='fame')S.fame+=c[2];if(k==='social'){S.fame+=1;S.mood+=c[2]};if(k==='family'){S.familyRep+=c[2]};S.study=clamp(S.study,0,99);S.gold=clamp(S.gold,0,999);S.health=clamp(S.health,0,15);S.mood=clamp(S.mood,0,10);S.logs.push(c[3]);S.currentEvent=null;render();}
function nextYear(){if(!S||!S.started)return;if(S.actions>0){toast('你還有餘暇，若要直接進入下一年請再次確認');S.actions=0}S.age++;S.year++;S.season=(S.season+1)%4;S.actions=2;S.currentEvent=null;annual();if(S.age>=80||S.health<=0){death();return}render();eventForAge();render();}
function annual(){S.gold-=1;if(S.familyType==='farmer')S.gold-=0;S.health-=S.age>55?1:0;S.mood+=S.age>50?0:1;if(S.jobLevel>0)S.gold+=Math.max(1,Math.floor(S.jobLevel/2));if(S.land>1)S.gold+=Math.floor(S.land/2);if(S.career==='official'){S.fame+=1;S.nation.treasury+=1}else if(S.career==='merchant'){S.gold+=1}else if(S.career==='military'){S.nation.power+=1}S.gold=clamp(S.gold,0,999);S.health=clamp(S.health,0,15);S.mood=clamp(S.mood,0,10);maybeCareer();if(S.age>18&&Math.random()<.16&&S.children.length<5){S.children.push({age:0,name:['安','寧','衡','瑤','景'][S.children.length]});S.logs.push('家中添了一名孩子。')}}
function maybeCareer(){if(S.career!=='none')return;if(S.age<16)return;if(S.familyType==='official'&&S.study>=8&&Math.random()<.55){S.career='official';S.jobLevel=1;S.jobTitle=JOBS.official[0][0];S.logs.push('你因家門與才學進入官署，從書吏做起。')}else if(S.study>=10&&Math.random()<.4){S.career='scholar';S.jobLevel=1;S.jobTitle=JOBS.scholar[0][0];S.logs.push('你走上讀書人的道路，先取得童生身分。')}else if(S.martial>=8&&Math.random()<.4){S.career='military';S.jobLevel=1;S.jobTitle=JOBS.military[0][0];S.logs.push('你進入軍伍，開始從基層做起。')}else if(S.trade>=8){S.career='merchant';S.jobLevel=1;S.jobTitle=JOBS.merchant[0][0];S.logs.push('你正式以商業為業。')}else if(S.craft>=8){S.career='artisan';S.jobLevel=1;S.jobTitle=JOBS.artisan[0][0];S.logs.push('你成為正式匠人。')}if(S.career!=='none')S.familyRep+=1}
function promote(){if(S.career==='none'){toast('你尚未有正式職業');return}const arr=JOBS[S.career];if(S.jobLevel>=arr.length){toast('已達此職業最高階');return}const need=6+S.jobLevel*3;const key=S.career==='scholar'?'study':S.career==='military'?'martial':S.career==='merchant'?'trade':S.career==='artisan'?'craft':'fame';if(S[key]<need){toast(`升階需要${key}達到 ${need}`);return}S.jobLevel++;S.jobTitle=arr[S.jobLevel-1][0];S.fame+=2;S.logs.push(`你晉升為${S.jobTitle}。現在能做的事更多，也要承擔更大的責任。`);render()}
function openWork(){showSheet(`<h2>職業與職權</h2><div class="row"><span>職業</span><b>${S.jobTitle}</b></div><div class="row"><span>職業階級</span><b>${S.jobLevel}</b></div><div class="row"><span>目前能行使的權力</span><span>${(JOBPOWER[S.career]||['先累積能力再入行'])[Math.max(0,S.jobLevel-1)]||'—'}</span></div><h3>升階</h3><p class="sub">${S.career==='none'?'你仍在摸索人生道路。':`目前能力：${S.career==='scholar'?S.study:S.career==='military'?S.martial:S.career==='merchant'?S.trade:S.career==='artisan'?S.craft:S.fame}`}</p><button class="action primary" onclick="promote();closeModal()">嘗試升階</button><h3>職權會帶來什麼</h3><div class="list">${(JOBPOWER[S.career]||[]).slice(0,Math.max(1,S.jobLevel)).map((x,i)=>`<div class="item">第${i+1}階：${x}</div>`).join('')}</div>`)}
function openPerson(){showSheet(`<h2>人物誌</h2>${[['姓名',S.familyName+S.name],['年歲',S.age+'歲'],['性別',S.sex],['出身',FAMILIES.find(f=>f.id===S.familyType)?.n],['性格',S.personality],['天賦',S.talents.join('、')],['父親',S.parents.father+(S.parents.alive?'（在世）':'（已故）')],['母親',S.parents.mother],['配偶',S.spouse||'未婚'],['子女',S.children.length+'人']].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}<h3>人生能力</h3><p>學識 ${S.study}・商才 ${S.trade}・手藝 ${S.craft}・武藝 ${S.martial}・名望 ${S.fame}・德行 ${S.virtue}</p>`)}
function openFamily(){const f=FAMILIES.find(x=>x.id===S.familyType);showSheet(`<h2>家族</h2><div class="row"><span>家門</span><b>${f.n}</b></div><div class="row"><span>家聲</span><b>${S.familyRep}</b></div><div class="row"><span>田產</span><b>${S.land}頃</b></div><div class="row"><span>宅第</span><b>${S.house}級</b></div><h3>親族職業影響</h3><p>${f.desc}。你的家門背景會影響你接觸的教育、資源與人脈。</p><h3>家中人口</h3><div class="list"><div class="item">父親：${S.parents.father}</div><div class="item">母親：${S.parents.mother}</div><div class="item">配偶：${S.spouse||'未婚'}</div><div class="item">子女：${S.children.length}人</div></div>`)}
function openWorld(){showSheet(`<h2>天下與地方</h2><div class="row"><span>所在</span><b>${S.region}</b></div>${[['民心',S.nation.people],['國庫',S.nation.treasury],['國力',S.nation.power],['安定',S.nation.stability]].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}<p class="sub">地方的糧價、災害、商路、徭役與戰事，都會反過來影響你的一生。</p>`)}
function openMenu(){showSheet(`<h2>遊戲選單</h2><div class="list"><button class="action" onclick="save()">💾 儲存此生</button><button class="action" onclick="loadGame()">📂 讀取存檔</button><button class="action" onclick="openRecords()">📜 生平紀錄</button><button class="action danger" onclick="if(confirm('重新開始這一生？')){start();closeModal()}</button></div>`)}
function openRecords(){showSheet(`<h2>生平紀錄</h2><div class="timeline">${S.logs.map(x=>`<div class="log">${x}</div>`).join('')}</div>`)}
function loadGame(){if(load()){closeModal();render();toast('已讀取存檔')}else toast('沒有找到存檔')}
function showSheet(html){$('sheet').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
function death(){S.parents.alive=false;const reason=S.health<=0?'病痛與衰弱':S.age>=80?'壽終正寢':'人生走到盡頭';S.logs.push(`你在${S.age}歲時${reason}。這一生結束，但家族與故事仍會延續。`);showSheet(`<h2>一生終章</h2><p>你${S.age}歲，${reason}。</p><p>這一生留下：家聲 ${S.familyRep}、名望 ${S.fame}、家財 ${S.gold}貫、子女 ${S.children.length}人。</p><button class="action primary" onclick="closeModal();start()">再次投胎</button>`)}
window.addEventListener('load',()=>{if(load()&&S?.started){render()}else renderStartChoice()});
</script>
</body>
</html>
